  <body>
    <div id="app">
      <aside id="sidebar" aria-label="Controls">
        <header>
          <h1>Cogniscient</h1>
          <p class="tagline">
            A pretty image exporter that's simple and runs in your browser.
            Built on cloud native tech and fed by open data.
            Search for data, select an area of interest, and export a pretty picture.
          </p>
          <br>
          <p class="byline">
            Built with ❤️ by <a href="https://auspatious.com/" target="_blank" rel="noopener">Auspatious</a>.
            Report issues <a href="https://github.com/auspatious/cogniscient/issues" target="_blank" rel="noopener">here</a>.
          </p>
        </header>
        <section id="panel-search" class="panel"></section>
        <section id="panel-items" class="panel"></section>
        <section id="panel-area" class="panel"></section>
        <section id="panel-visualise" class="panel"></section>
        <section id="panel-export" class="panel"></section>
        <section id="panel-share" class="panel"></section>
        <section id="panel-status" class="panel" aria-live="polite"></section>
      </aside>
      <main id="map-container">
        <div id="map"></div>
        <div id="map-spinner" aria-hidden="true"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
